seed: 0

data:
  signal: accelerometer_3axis
  units: g
  sampling_rate_hz: 20
  window_size: 50          # 2.5 s
  stride: 25               # 50% overlap
  max_gap_s: 0.5           # no window across a gap, subject change or activity change
  num_classes: 5
  classes: [walking, upstairs, downstairs, sitting, standing]
  normalization: source_train_per_channel   # mean/std from source-train only, gravity kept
  processed_file: data/processed/{domain}.npz
  splits_file: splits/{domain}.json

train:
  optimizer: adam
  batch_size: 128
  max_epochs: 30
  early_stopping_patience: 5
  early_stopping_metric: source_val_macro_f1
  loss: class_weighted_cross_entropy

model:
  target_params: 75000
  param_tolerance: 0.10    # all three models within 10% of each other

tuning:
  n_configs: 8
  max_epochs: 15
  split: 0
  seed: 0
  # search: lr {3e-4, 1e-3, 3e-3}, dropout, weight decay, kernel size (TODO: fix the exact values)

final:
  seeds: [0, 1, 2]         # seed k uses split k

eval:
  headline_metric: macro_f1
  metrics: [acc, macro_f1, weighted_f1, kappa]
